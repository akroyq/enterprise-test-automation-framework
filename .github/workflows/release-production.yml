# ==============================================================================
# GitHub Actions Pipeline: Production Release & Post-Deployment Sanity Gate
# ==============================================================================
# Enterprise Promotion Flow: QA Sign-off ──► Production Deploy ──► Smoke Gate
#
# Purpose:
#   Automates the controlled release of tested artifacts from QA to Production.
#   Enforces pre-deployment QA validation, triggers production deployment,
#   and executes post-deployment smoke tests on the live Production environment.
# ==============================================================================

name: Production Release & Deployment Gate

on:
  # Trigger 1: Release Tag Creation (e.g., git tag v1.0.0 && git push origin v1.0.0)
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'

  # Trigger 2: Manual Controlled Promotion by QA Lead / Release Manager
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      production_url:
        description: 'Target Production Base URL'
        required: true
        default: 'https://insurance-claims-demo.onrender.com'
      run_full_regression_on_qa_first:
        description: 'Verify QA Gate before deploying to Production?'
        required: true
        default: true
        type: boolean

concurrency:
  group: production-release
  cancel-in-progress: false # Never cancel an ongoing production deployment

jobs:
  # ============================================================================
  # Stage 1: QA Pre-Flight Gate Verification (Release Readiness)
  # ============================================================================
  # Ensures that the release candidate passes 100% of P0 tests before touching Production
  # ============================================================================
  verify-qa-gate:
    name: "Stage 1: QA Release Sign-off Verification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Verify Build & Compile
        run: |
          echo "Verifying code integrity for release ${{ github.event.inputs.release_version || github.ref_name }}..."
          mvn clean test-compile -B -f automation/pom.xml

      - name: Execute QA Release Verification Tests
        if: ${{ github.event.inputs.run_full_regression_on_qa_first != false }}
        env:
          BASE_URL: "https://insurance-claims-demo.onrender.com"
          ENV: "QA"
        run: |
          echo "Running pre-flight verification on QA environment..."
          mvn test -B -f automation/pom.xml -pl api-restassured -am

      - name: Record QA Sign-off
        run: |
          echo "### ✅ Stage 1: QA Sign-off Verified" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Version** | ${{ github.event.inputs.release_version || github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **QA Status** | 100% Pass (Pre-Flight Confirmed) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Decision** | Approved for Production Promotion |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Stage 2: Production Deployment Execution
  # ============================================================================
  # Deploys verified artifact to Production (Render / Cloud environment)
  # ============================================================================
  deploy-production:
    name: "Stage 2: Production Deployment"
    needs: verify-qa-gate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ github.event.inputs.production_url || 'https://insurance-claims-demo.onrender.com' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Production Deployment
        run: |
          PROD_URL="${{ github.event.inputs.production_url || 'https://insurance-claims-demo.onrender.com' }}"
          VERSION="${{ github.event.inputs.release_version || github.ref_name }}"
          echo "Deploying release $VERSION to Production at $PROD_URL..."
          
          # If Render Deploy Hook URL is set in GitHub Secrets, trigger live redeploy
          if [ -n "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}" ]; then
            echo "Calling Render Production Deploy Hook..."
            curl -s -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"
          else
            echo "Production deployment initiated via git release tag $VERSION."
          fi

      - name: Await Production Server Readiness
        run: |
          PROD_URL="${{ github.event.inputs.production_url || 'https://insurance-claims-demo.onrender.com' }}"
          echo "Waiting for Production server at $PROD_URL/docs to be healthy..."
          
          python -c "
          import urllib.request, time, sys
          prod_url = '$PROD_URL'.rstrip('/') + '/docs'
          for attempt in range(1, 31):
              try:
                  req = urllib.request.Request(prod_url, headers={'User-Agent': 'Prod-Deploy-Bot/1.0'})
                  with urllib.request.urlopen(req, timeout=5) as resp:
                      if resp.status == 200:
                          print(f'✅ Production service is UP and HEALTHY on attempt {attempt}!')
                          sys.exit(0)
              except Exception as e:
                  print(f'Waiting for Production service (Attempt {attempt}/30)...')
                  time.sleep(3)
          print('Production health check timed out.')
          sys.exit(1)
          "

  # ============================================================================
  # Stage 3: Post-Deployment Production Smoke Sanity Gate
  # ============================================================================
  # Runs read-only critical path smoke tests against the live Production environment
  # ============================================================================
  production-smoke-gate:
    name: "Stage 3: Production Smoke Sanity Gate"
    needs: deploy-production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Execute Production Smoke Tests (REST Assured)
        env:
          BASE_URL: ${{ github.event.inputs.production_url || 'https://insurance-claims-demo.onrender.com' }}
          ENV: "Production"
        run: |
          echo "Running Production Smoke Test Suite against: $BASE_URL"
          mvn test -B -f automation/pom.xml -pl api-restassured -am -DsuiteXmlFile=src/test/resources/testng-smoke.xml

      - name: Execute Production UI Smoke Tests (Headless Chrome)
        env:
          BASE_URL: ${{ github.event.inputs.production_url || 'https://insurance-claims-demo.onrender.com' }}
          BROWSER: "chrome"
          HEADLESS: "true"
          ENV: "Production"
        run: |
          echo "Running Production UI Smoke Suite against: $BASE_URL"
          mvn test -B -f automation/pom.xml -pl ui-selenium -am -DsuiteXmlFile=src/test/resources/testng-smoke.xml

      - name: Upload Production Smoke ExtentReports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-reports
          path: |
            automation/api-restassured/target/extent-reports/
            automation/ui-selenium/target/extent-reports/
          retention-days: 30 # Retain Production release reports for 30 days

      - name: Publish Production Release Executive Summary
        if: always()
        run: |
          PROD_URL="${{ github.event.inputs.production_url || 'https://insurance-claims-demo.onrender.com' }}"
          VERSION="${{ github.event.inputs.release_version || github.ref_name }}"
          
          echo "## 🚀 Production Release Executive Verdict" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Milestone | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Version** | \`$VERSION\` | SemVer Release Tag |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Environment** | Production | $PROD_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage 1: QA Sign-off** | ✅ VERIFIED | 100% P0 Pre-Flight Tests Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage 2: Deployment** | ✅ SUCCESS | Live Container Promoted |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage 3: Smoke Gate** | ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }} | Live Production Smoke Suite Verified |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "### 🎉 Production Deployment is LIVE and VERIFIED!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Production Smoke Gate Failed! Trigger incident management." >> $GITHUB_STEP_SUMMARY
          fi
