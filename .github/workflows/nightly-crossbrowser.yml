# ==============================================================================
# GitHub Actions Pipeline: Nightly Cross-Browser Regression Gate (Live QA)
# ==============================================================================
# Executes automated cross-browser UI regression tests across multiple browsers
# (Google Chrome and Mozilla Firefox) against the Live QA Environment.
# ==============================================================================

name: Nightly Cross-Browser Regression Gate

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'TestNG Suite XML file to execute'
        required: true
        default: 'src/test/resources/testng-crossbrowser.xml'
        type: choice
        options:
          - 'src/test/resources/testng-crossbrowser.xml'
          - 'src/test/resources/testng.xml'
          - 'src/test/resources/testng-smoke.xml'
      target_env_url:
        description: 'Target QA Environment URL (Leave empty for default QA URL)'
        required: false
        default: ''

concurrency:
  group: nightly-crossbrowser-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_QA_URL: "https://insurance-claims-demo.onrender.com"
  ENV_NAME: "QA"

jobs:
  cross-browser-matrix:
    name: "Cross-Browser [QA]: ${{ matrix.browser }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Python 3.12 (For health check & fallback service)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: demo-app/requirements.txt

      - name: Install Application Dependencies
        run: pip install -r demo-app/requirements.txt

      - name: Resolve Live QA Target Environment
        id: resolve-qa
        run: |
          QA_URL="${{ github.event.inputs.target_env_url || vars.QA_BASE_URL || secrets.QA_BASE_URL || env.DEFAULT_QA_URL }}"
          echo "TARGET_QA_URL=$QA_URL" >> $GITHUB_ENV
          
          python -c "
          import urllib.request, time, sys, os
          qa_url = os.environ.get('TARGET_QA_URL', 'https://insurance-claims-demo.onrender.com').rstrip('/')
          try:
              req = urllib.request.Request(f'{qa_url}/docs', headers={'User-Agent': 'CI-HealthCheck-Bot/1.0'})
              with urllib.request.urlopen(req, timeout=10) as resp:
                  if resp.status == 200:
                      print(f'✅ Live QA Environment ready: {qa_url}')
                      sys.exit(0)
          except Exception as e:
              print(f'Remote QA unavailable: {e}')
              sys.exit(2)
          " || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 2 ]; then
              echo "Starting local fallback FastAPI instance on port 8000..."
              nohup uvicorn app:app --app-dir demo-app --host 0.0.0.0 --port 8000 > app.log 2>&1 &
              sleep 3
              echo "TARGET_QA_URL=http://localhost:8000" >> $GITHUB_ENV
            else
              exit 1
            fi
          }

      - name: Execute UI Suite on ${{ matrix.browser }} (Live QA)
        env:
          BASE_URL: ${{ env.TARGET_QA_URL }}
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          ENV: "QA"
        run: |
          SUITE_FILE="${{ github.event.inputs.test_suite || 'src/test/resources/testng-crossbrowser.xml' }}"
          echo "Executing on ${{ matrix.browser }} against Live QA: $BASE_URL"
          mvn test -B -f automation/pom.xml -pl ui-selenium -am -DsuiteXmlFile="$SUITE_FILE" -Dbrowser=${{ matrix.browser }}

      - name: Upload Cross-Browser Reports (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-reports-${{ matrix.browser }}
          path: |
            automation/ui-selenium/target/extent-reports/
            automation/ui-selenium/target/surefire-reports/
            automation/ui-selenium/target/screenshots/
          retention-days: 14

      - name: Publish Matrix Step Summary
        if: always()
        run: |
          echo "### 🌐 Browser Regression: ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Environment** | QA (${{ env.TARGET_QA_URL }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Browser** | ${{ matrix.browser }} (Headless) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Reports** | Spark HTML ExtentReports attached in artifacts |" >> $GITHUB_STEP_SUMMARY
