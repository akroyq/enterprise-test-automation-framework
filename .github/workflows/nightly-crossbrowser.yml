# ==============================================================================
# GitHub Actions Pipeline: Nightly Cross-Browser Regression Gate
# ==============================================================================
# Purpose:
#   As defined in Quality Architecture Strategy Document (Section 8.1), this
#   pipeline executes automated cross-browser UI regression tests across multiple
#   browsers (Google Chrome and Mozilla Firefox) in parallel.
#
# Key Highlights:
#   - Scheduled Execution: Runs automatically every night at 00:00 UTC (cron).
#   - On-Demand Execution: Can be manually triggered with custom TestNG suite selection.
#   - Matrix Strategy: Parallel test execution across browser environments.
#   - Reporting: Generates and archives browser-specific ExtentReports 5.x Spark HTML.
# ==============================================================================

name: Nightly Cross-Browser Regression Gate

# ------------------------------------------------------------------------------
# Trigger Conditions
# ------------------------------------------------------------------------------
on:
  # Scheduled Trigger: Runs automatically at midnight UTC (00:00 UTC) every single day
  schedule:
    - cron: '0 0 * * *'

  # Manual Trigger: Enables team members to trigger cross-browser runs on-demand
  # with configurable suite selection from the GitHub Actions web UI
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'TestNG Suite XML file to execute'
        required: true
        default: 'src/test/resources/testng-crossbrowser.xml'
        type: choice
        options:
          - 'src/test/resources/testng-crossbrowser.xml'
          - 'src/test/resources/testng.xml'
          - 'src/test/resources/testng-smoke.xml'

# ------------------------------------------------------------------------------
# Concurrency Management
# ------------------------------------------------------------------------------
# Prevent redundant concurrent nightly runs from consuming overlapping runner hours
concurrency:
  group: nightly-crossbrowser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Cross-Browser Execution Job (Matrix Strategy)
  # ============================================================================
  # GitHub Actions spawns parallel runner jobs for each entry in the browser matrix:
  #   - Job 1: Headless Google Chrome
  #   - Job 2: Headless Mozilla Firefox
  # fail-fast: false ensures that if one browser fails, the other browser completes
  # its full regression run so we get complete diagnostic data across both platforms.
  # ============================================================================
  cross-browser-matrix:
    name: "Cross-Browser: ${{ matrix.browser }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Do not abort other browsers if one encounters a test failure
      matrix:
        browser: [chrome, firefox] # Test matrix: Chrome & Firefox on Ubuntu runners

    steps:
      # Step 1: Checkout the source code from the repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 JDK (Temurin) and enable Maven caching
      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Step 3: Set up Python 3.12 environment with pip package caching
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: demo-app/requirements.txt

      # Step 4: Install FastAPI and application dependencies
      - name: Install Application Dependencies
        run: pip install -r demo-app/requirements.txt

      # Step 5: Launch FastAPI Claims portal backend in background mode
      # '--app-dir demo-app' ensures module path is resolved properly by Uvicorn
      - name: Start FastAPI Demo Application
        run: |
          nohup uvicorn app:app --app-dir demo-app --host 0.0.0.0 --port 8000 > app.log 2>&1 &
          echo "FastAPI background PID: $!"

      # Step 6: Active polling health check loop
      # Confirms backend readiness before starting browser automation
      - name: Verify Service Health Check
        run: |
          echo "Waiting for FastAPI service to become healthy..."
          python -c "
          import urllib.request, time, sys
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=2) as response:
                      if response.status == 200:
                          print(f'Service ready on attempt {attempt+1}.')
                          sys.exit(0)
              except Exception:
                  time.sleep(1)
          print('Service failed to respond within timeout.')
          sys.exit(1)
          "

      # Step 7: Execute Selenium UI Tests on current matrix browser
      # -DsuiteXmlFile allows dynamic suite selection (defaults to testng-crossbrowser.xml)
      # -Dbrowser passes the targeted browser to DriverFactory (chrome or firefox)
      # HEADLESS: 'true' ensures execution on headless Linux display
      - name: Execute UI Suite on ${{ matrix.browser }}
        env:
          BASE_URL: "http://localhost:8000"
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          ENV: "Nightly-CI"
        run: |
          SUITE_FILE="${{ github.event.inputs.test_suite || 'src/test/resources/testng-crossbrowser.xml' }}"
          mvn test -B -f automation/pom.xml -pl ui-selenium -am -DsuiteXmlFile="$SUITE_FILE" -Dbrowser=${{ matrix.browser }}

      # Step 8: Upload browser-specific test artifacts (ExtentReports HTML, Screenshots, Surefire XML)
      # if: always() guarantees logs are preserved even on assertion failures
      - name: Upload Cross-Browser Reports (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-reports-${{ matrix.browser }}
          path: |
            automation/ui-selenium/target/extent-reports/
            automation/ui-selenium/target/surefire-reports/
            automation/ui-selenium/target/screenshots/
          retention-days: 14

      # Step 9: Render browser status card to GitHub Actions Step Summary
      - name: Publish Matrix Step Summary
        if: always()
        run: |
          echo "### 🌐 Browser Regression: ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Browser** | ${{ matrix.browser }} (Headless) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Reports** | Spark HTML ExtentReports attached in artifacts |" >> $GITHUB_STEP_SUMMARY
